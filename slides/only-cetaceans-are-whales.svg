<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 355" width="520" height="355" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#d9d4c7"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#8a8578" stroke-width="3"/>
    </pattern>
    <mask id="pNotQ">
      <rect width="520" height="320" fill="black"/>
      <circle cx="315" cy="160" r="115" fill="white"/>
      <circle cx="205" cy="160" r="115" fill="black"/>
    </mask>
  </defs>
  <!-- domain -->
  <rect x="10" y="10" width="500" height="300" rx="6" fill="#fffff8" stroke="#888" stroke-width="2"/>
  <text x="26" y="38" font-size="18" fill="#666" font-style="italic">domain</text>
  <!-- Q outside P: empty -->
  <rect width="520" height="320" fill="url(#hatch)" mask="url(#pNotQ)"/>
  <!-- circles -->
  <circle cx="205" cy="160" r="115" fill="none" stroke="#1f5fbf" stroke-width="3.5"/>
  <circle cx="315" cy="160" r="115" fill="none" stroke="#c2410c" stroke-width="3.5"/>
  <text x="30" y="72" font-size="30" font-style="italic" fill="#1f5fbf">P</text>
  <text x="30" y="94" font-size="15" fill="#1f5fbf">cetaceans</text>
  <text x="492" y="72" text-anchor="end" font-size="30" font-style="italic" fill="#c2410c">Q</text>
  <text x="492" y="94" text-anchor="end" font-size="15" fill="#c2410c">whales</text>
  <!-- comment -->
  <text x="260" y="342" font-size="20" font-style="italic" text-anchor="middle" fill="#444">shaded area is empty</text>
</svg>
